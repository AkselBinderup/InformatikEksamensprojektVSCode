<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Udstyrsbooking</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
    integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/bookingstyle.css">
</head>

<body>
  <header>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
          });
      });
    </script>
    <link rel="stylesheet" href="../css/navbar.css">
  </header>

  <div class="container mt-5">
    <p>.</p>
    <div class="row">
      <!-- Left Sidebar -->
      <div class="col-md-4">
        <div class="box">
          <h3>Indstillinger</h3>
          <form id="bookingForm">
            <div class="form-group">
              <label for="numPeople">Antal personer:</label>
              <input type="range" id="numPeople" name="numPeople" min="1" max="100" value="10"
                oninput="updateSliderValue('numPeople', 'sliderValuePeople')">
              <div class="slider-value" id="sliderValuePeople">10</div>
            </div>
            <div class="form-group">
              <label for="numPCs">Antal PC'er:</label>
              <input type="range" id="numPCs" name="numPCs" min="1" max="100" value="10"
                oninput="updateSliderValue('numPCs', 'sliderValuePCs')">
              <div class="slider-value" id="sliderValuePCs">10</div>
            </div>
            <button type="button" class="btn btn-primary btn-block" onclick="calculateEstimate()">Beregn</button>

          </form>
        </div>
        <!-- Estimated Price Section -->
        <div class="box mt-3">
          <h5>Estimeret Omkostninger:</h5>
          <p id="totalEstimate">Samlet pris: 0 DKK</p>
        </div>
      </div>

      <!-- Main Content: Equipment Gallery -->
      <div class="col-md-8">
        <div class="box">
          <h3>PC Udstyr</h3>
          <div class="gallery" id="pcEquipmentGallery">
            <!-- PC Equipment items will be dynamically updated -->
          </div>
        </div>
        <div class="box">
          <h3>Netværksudstyr</h3>
          <div class="gallery" id="networkEquipmentGallery">
            <!-- Network Equipment items will be dynamically updated -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/booking.js"></script>
  <script>
    // Equipment data
    const equipmentData = {
      pc: [
        { id: 'mouse', name: 'Mus', image: '../images/mouse.png', price: 50, info: 'En mus til gaming.' },
        { id: 'keyboard', name: 'Tastatur', image: '../images/keyboard.png', price: 100, info: 'Et mekanisk tastatur.' },
        { id: 'headset', name: 'Headset', image: '../images/headphones.png', price: 75, info: 'Et headset med mikrofon.' },
        { id: 'extensionCord', name: 'Forlængerledning', image: '../images/ExtentionCable.png', price: 25, info: 'En 5 meter forlængerledning.' }
      ],
      network: [
        { id: 'router', name: 'Router', image: '../images/router.png', price: 200, info: 'En trådløs router.' },
        { id: 'switch', name: 'Netværksswitch', image: '../images/switch.png', price: 150, info: 'En switch til netværk.' },
        { id: 'ethernet', name: 'Ethernetkabel', image: '../images/EthernetCable.png', price: 10, info: 'Et 10 meter ethernetkabel.' },
        { id: 'accessPoint', name: 'Access Point', image: '../images/accessPoint.png', price: 100, info: 'Et trådløst access point.' }
      ]
    };
  
    // Selected equipment
    const selectedEquipment = [];
  
    // Update the PC and Network galleries
    function updateGalleries() {
      updateGallery('pc', 'pcEquipmentGallery');
      updateGallery('network', 'networkEquipmentGallery');
    }
  
    // Update a specific gallery
    function updateGallery(type, galleryId) {
      const gallery = document.getElementById(galleryId);
      gallery.innerHTML = ''; // Clear the gallery
  
      equipmentData[type].forEach(item => {
        const galleryItem = document.createElement('div');
        galleryItem.className = 'gallery-item';
        galleryItem.onclick = () => toggleSelection(galleryItem, item);
  
        // Check if the item is already selected
        if (selectedEquipment.some(e => e.id === item.id)) {
          galleryItem.classList.add('selected');
        }
  
        galleryItem.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <p>${item.name} - ${item.price} DKK</p>
          <small>${item.info}</small>
        `;
  
        gallery.appendChild(galleryItem);
      });
    }
  
    // Toggle selection of gallery items
    function toggleSelection(element, item) {
      element.classList.toggle('selected');
      if (element.classList.contains('selected')) {
        selectedEquipment.push(item);
      } else {
        const index = selectedEquipment.findIndex(e => e.id === item.id);
        if (index > -1) selectedEquipment.splice(index, 1);
      }
      calculateEstimate();
    }
  
    // Calculate estimate
    function calculateEstimate() {
      const numPeople = parseInt(document.getElementById('numPeople').value);
      const numPCs = parseInt(document.getElementById('numPCs').value);
  
      // Calculate equipment cost
      const equipmentCost = selectedEquipment.reduce((sum, item) => sum + item.price, 0);
  
      // Add cost based on number of people and PCs
      const peopleCost = numPeople * 10; // Example: 10 DKK per person
      const pcCost = numPCs * 50; // Example: 50 DKK per PC
  
      const totalCost = equipmentCost + peopleCost + pcCost;
  
      // Generate recommended amounts
      const recommendations = selectedEquipment.map(item => {
        let recommendedAmount = 0;
  
        // Example logic for recommendations
        if (item.id === 'mouse' || item.id === 'keyboard' || item.id === 'headset') {
          recommendedAmount = numPCs; // One per PC
        } else if (item.id === 'extensionCord') {
          recommendedAmount = Math.ceil(numPeople / 5); // One per 5 people
        } else if (item.id === 'router') {
          recommendedAmount = 1; // One router per event
        } else if (item.id === 'switch') {
          recommendedAmount = Math.ceil(numPeople / 24); // One switch per 24 people
        } else if (item.id === 'ethernet') {
          recommendedAmount = numPeople; // One cable per person
        } else if (item.id === 'accessPoint') {
          recommendedAmount = Math.ceil(numPeople / 15); // One access point per 15 people
        }
  
        return `${item.name}: ${recommendedAmount} stk.`;
      });
  
      // Update the estimate section
      const estimateText = `
        <h5>Valgte Udstyr:</h5>
        <ul>
          ${selectedEquipment.map(item => `<li>${item.name} - ${item.price} DKK</li>`).join('')}
        </ul>
        <h5>Anbefalet Mængde:</h5>
        <ul>
          ${recommendations.map(rec => `<li>${rec}</li>`).join('')}
        </ul>
        <h5>Samlet Pris:</h5>
        <p>${totalCost} DKK</p>
      `;
  
      document.getElementById('totalEstimate').innerHTML = estimateText;
    }
  
    // Update slider value display
    function updateSliderValue(sliderId, displayId) {
      const slider = document.getElementById(sliderId);
      const sliderValue = document.getElementById(displayId);
      sliderValue.textContent = slider.value;
    }
  
    // Initialize the galleries
    document.addEventListener('DOMContentLoaded', updateGalleries);
  </script>
</body>

</html>
