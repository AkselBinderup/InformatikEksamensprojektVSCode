<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Udstyrsbooking</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
    integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/bookingstyle.css">
</head>

<body>
  <header>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
          });
      });
    </script>
    <link rel="stylesheet" href="../css/navbar.css">
  </header>

  <div class="container mt-5">
    <p> .</p>
    <div class="row">
      <!-- Left Sidebar -->
      <div class="col-md-4">
        <div class="box">
          <h3>Indstillinger</h3>
          <form id="bookingForm">
            <div class="form-group">
              <label for="numPeople">Antal personer:</label>
              <input type="range" id="numPeople" name="numPeople" min="1" max="100" value="10"
                oninput="updateSliderValue('numPeople', 'sliderValuePeople')">
              <div class="slider-value" id="sliderValuePeople">10</div>
            </div>
            <div class="form-group">
              <label for="numPCs">Antal PC'er:</label>
              <input type="range" id="numPCs" name="numPCs" min="1" max="100" value="10"
                oninput="updateSliderValue('numPCs', 'sliderValuePCs')">
              <div class="slider-value" id="sliderValuePCs">10</div>
            </div>
            <div class="form-group">
              <label for="equipmentType">Vælg udstyrstype:</label>
              <select id="equipmentType" class="form-control" onchange="updateGallery()">
                <option value="pc">PC-udstyr</option>
                <option value="network">Netværksudstyr</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary btn-block" onclick="calculateEstimate()">Beregn</button>
          </form>
        </div>
      </div>

      <!-- Main Content: Equipment Gallery -->
      <div class="col-md-8">
        <div class="box">
          <h3>Vælg udstyr</h3>
          <div class="gallery" id="equipmentGallery">
            <!-- Gallery items will be dynamically updated -->
          </div>
        </div>
        <!-- Estimate Section -->
        <div id="result" class="result mt-4" style="display: none;">
          <h3>Estimeret udstyr og omkostninger:</h3>
          <p id="estimateText"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/booking.js"></script>
  <script>
    // Equipment data
    const equipmentData = {
      pc: [
        { id: 'mouse', name: 'Mus', image: '../images/mouse.png' },
        { id: 'keyboard', name: 'Tastatur', image: '../images/keyboard.png' },
        { id: 'headset', name: 'Headset', image: '../images/headphones.png' },
        { id: 'extensionCord', name: 'Forlængerledning', image: '../images/ExtentionCable.png' }
      ],
      network: [
        { id: 'router', name: 'Router', image: '../images/router.png' },
        { id: 'switch', name: 'Netværksswitch', image: '../images/switch.png' },
        { id: 'ethernet', name: 'Ethernetkabel', image: '../images/EthernetCable.png' },
        { id: 'accessPoint', name: 'Access Point', image: '../images/accessPoint.png' }
      ]
    };

    // Update the gallery based on the selected equipment type
    function updateGallery() {
      const equipmentType = document.getElementById('equipmentType').value;
      const gallery = document.getElementById('equipmentGallery');
      gallery.innerHTML = ''; // Clear the gallery

      equipmentData[equipmentType].forEach(item => {
        const galleryItem = document.createElement('div');
        galleryItem.className = 'gallery-item';
        galleryItem.onclick = () => toggleSelection(galleryItem, item.id);

        galleryItem.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <p>${item.name}</p>
        `;

        gallery.appendChild(galleryItem);
      });
    }

    // Toggle selection of gallery items
    function toggleSelection(element, value) {
      element.classList.toggle('selected');
      const selectedEquipment = document.getElementById('selectedEquipment') || [];
      if (element.classList.contains('selected')) {
        selectedEquipment.push(value);
      } else {
        const index = selectedEquipment.indexOf(value);
        if (index > -1) selectedEquipment.splice(index, 1);
      }
    }

    // Update slider value display
    function updateSliderValue(sliderId, displayId) {
      const slider = document.getElementById(sliderId);
      const sliderValue = document.getElementById(displayId);
      sliderValue.textContent = slider.value;
    }

    // Calculate estimate
    function calculateEstimate() {
      const numPeople = parseInt(document.getElementById('numPeople').value);
      const numPCs = parseInt(document.getElementById('numPCs').value);
      const selectedEquipment = Array.from(document.querySelectorAll('.gallery-item.selected'))
        .map(item => item.querySelector('p').textContent);

      if (!numPeople || !numPCs || selectedEquipment.length === 0) {
        alert('Vælg venligst antal personer, PC\'er og mindst ét udstyr.');
        return;
      }

      let estimate = `For ${numPeople} personer og ${numPCs} PC'er, skal du bruge:\n`;
      selectedEquipment.forEach(item => {
        estimate += `- ${item}\n`;
      });

      const bandwidth = numPeople * 10; // 10 Mbps per person
      estimate += `\nInternetbåndbredde: ${bandwidth} Mbps\n`;

      const costPerPC = 50; // Example cost per PC
      const totalCost = numPCs * costPerPC;
      estimate += `\nEstimerede omkostninger: $${totalCost}`;

      document.getElementById('estimateText').innerText = estimate;
      document.getElementById('result').style.display = 'block';
    }

    // Initialize the gallery with PC equipment by default
    document.addEventListener('DOMContentLoaded', updateGallery);
  </script>
</body>

</html>
