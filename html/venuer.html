<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venuer</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
    integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/stylesheet.css">
</head>

<body>
  <header>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
          });
      });
    </script>
    <link rel="stylesheet" href="../css/navbar.css">
  </header>

  <div class="container mt-5">
    <div class="row">
      <!-- Left Sidebar -->
      <div class="col-md-4">
        <div class="box">
          <h3>Opret Venue</h3>
          <button class="btn btn-primary btn-block mb-3" onclick="toggleVenueForm()">Opret Venue</button>
          <form id="venueForm" class="hidden">
            <div class="form-group">
              <label for="venueName">Venue Navn:</label>
              <input type="text" id="venueName" class="form-control" placeholder="Indtast venue navn" required>
            </div>
            <div class="form-group">
              <label for="venueLocation">Placering:</label>
              <input type="text" id="venueLocation" class="form-control" placeholder="Indtast venue placering" required>
            </div>
            <div class="form-group">
              <label for="venueCapacity">Kapacitet:</label>
              <input type="number" id="venueCapacity" class="form-control" placeholder="Indtast kapacitet" required>
            </div>
            <button type="button" class="btn btn-success btn-block" onclick="addVenue()">Gem Venue</button>
          </form>
        </div>
      </div>

      <!-- Right Pane: Venue List -->
      <div class="col-md-8">
        <div class="box">
          <h3 class="text-center">Tilgængelige Venuer</h3>
          <ul id="venueList" class="list-group">
            <!-- Venues will be dynamically added here -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5">
    <p>&copy; 2023 CaféGaming. Alle rettigheder forbeholdes.</p>
  </footer>

  <script>
    // Function to toggle the visibility of the venue creation form
    function toggleVenueForm() {
      const venueForm = document.getElementById('venueForm');
      venueForm.classList.toggle('hidden');
    }

    // Function to add a new venue to the list
    function addVenue() {
      const venueName = document.getElementById('venueName').value;
      const venueLocation = document.getElementById('venueLocation').value;
      const venueCapacity = document.getElementById('venueCapacity').value;

      if (venueName && venueLocation && venueCapacity) {
        const venueList = document.getElementById('venueList');
        const listItem = document.createElement('li');
        listItem.className = 'list-group-item d-flex justify-content-between align-items-center';

        // Venue details
        const venueDetails = document.createElement('span');
        venueDetails.textContent = `${venueName} - ${venueLocation} (Kapacitet: ${venueCapacity})`;
        listItem.appendChild(venueDetails);

        // Edit button
        const editButton = document.createElement('button');
        editButton.className = 'btn btn-sm btn-warning me-2';
        editButton.textContent = 'Rediger';
        editButton.onclick = () => editVenue(listItem, venueDetails);
        listItem.appendChild(editButton);

        // Delete button
        const deleteButton = document.createElement('button');
        deleteButton.className = 'btn btn-sm btn-danger';
        deleteButton.textContent = 'Slet';
        deleteButton.onclick = () => deleteVenue(listItem);
        listItem.appendChild(deleteButton);

        venueList.appendChild(listItem);

        // Clear the form fields and hide the form
        document.getElementById('venueForm').reset();
        toggleVenueForm();
      } else {
        alert('Udfyld venligst alle felter for at oprette en venue.');
      }
    }

    // Function to delete a venue
    function deleteVenue(listItem) {
      if (confirm('Er du sikker på, at du vil slette denne venue?')) {
        listItem.remove();
      }
    }

    // Function to edit a venue
    function editVenue(listItem, venueDetails) {
      const [name, locationAndCapacity] = venueDetails.textContent.split(' - ');
      const [location, capacity] = locationAndCapacity.replace('Kapacitet: ', '').split(' (');

      // Populate the form with the current venue details
      document.getElementById('venueName').value = name;
      document.getElementById('venueLocation').value = location;
      document.getElementById('venueCapacity').value = capacity.replace(')', '');

      // Show the form
      toggleVenueForm();

      // Update the venue on form submission
      const saveButton = document.querySelector('#venueForm button');
      saveButton.textContent = 'Gem Ændringer';
      saveButton.onclick = () => {
        venueDetails.textContent = `${document.getElementById('venueName').value} - ${document.getElementById('venueLocation').value} (Kapacitet: ${document.getElementById('venueCapacity').value})`;
        saveButton.textContent = 'Gem Venue';
        saveButton.onclick = addVenue; // Reset the button to its original functionality
        document.getElementById('venueForm').reset();
        toggleVenueForm();
      };
    }
  </script>
</body>

</html>
