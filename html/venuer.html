<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venuer</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
    integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/stylesheet.css">
  <link rel="stylesheet" href="../css/bookingstyle.css">
</head>

<body>
  <header>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("navbar.html")
          .then(response => response.text())
          .then(data => {
            document.body.insertAdjacentHTML("afterbegin", data);
          });
      });
    </script>
    <link rel="stylesheet" href="../css/navbar.css">
  </header>

  <div class="container mt-5">
    <div class="row">
      <!-- Left Sidebar -->
      <div class="col-md-4">
        <div class="box">
          <h3>Opret Venue</h3>
          <button class="btn btn-primary btn-block mb-3" onclick="toggleVenueForm()">Opret Venue</button>
          <form id="venueForm" class="hidden">
            <div class="form-group">
              <label for="venueName">Venue Navn:</label>
              <input type="text" id="venueName" class="form-control" placeholder="Indtast venue navn" required>
            </div>
            <div class="form-group">
              <label for="venueLocation">Placering:</label>
              <input type="text" id="venueLocation" class="form-control" placeholder="Indtast venue placering" required>
            </div>
            <div class="form-group">
              <label for="venueCapacity">Kapacitet:</label>
              <input type="number" id="venueCapacity" class="form-control" placeholder="Indtast kapacitet" required>
            </div>
            <div class="form-group">
              <label for="numPeople">Antal personer:</label>
              <input type="range" id="numPeople" name="numPeople" min="1" max="100" value="10"
                oninput="updateSliderValue('numPeople', 'sliderValuePeople')">
              <div class="slider-value" id="sliderValuePeople">10</div>
            </div>
            <div class="form-group">
              <label for="equipmentType">Vælg udstyrstype:</label>
              <select id="equipmentType" class="form-control" onchange="updateGallery()">
                <option value="pc">PC-udstyr</option>
                <option value="network">Netværksudstyr</option>
              </select>
            </div>
            <div class="form-group">
              <h5>Vælg udstyr:</h5>
              <div class="gallery" id="equipmentGallery">
                <!-- Gallery items will be dynamically updated -->
              </div>
            </div>
            <div class="form-group">
              <h5>Estimeret Omkostninger:</h5>
              <p id="estimateText">0 DKK</p>
            </div>
            <button type="button" class="btn btn-success btn-block" onclick="addVenue()">Gem Venue</button>
          </form>
        </div>
      </div>

      <!-- Right Pane: Venue List -->
      <div class="col-md-8">
        <div class="box">
          <h3 class="text-center">Tilgængelige Venuer</h3>
          <ul id="venueList" class="list-group">
            <!-- Venues will be dynamically added here -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5">
    <p>&copy; 2023 CaféGaming. Alle rettigheder forbeholdes.</p>
  </footer>

  <script>
    // Equipment data
    const equipmentData = {
      pc: [
        { id: 'mouse', name: 'Mus', image: '../images/mouse.png', price: 50 },
        { id: 'keyboard', name: 'Tastatur', image: '../images/keyboard.png', price: 100 },
        { id: 'headset', name: 'Headset', image: '../images/headphones.png', price: 75 },
        { id: 'extensionCord', name: 'Forlængerledning', image: '../images/ExtentionCable.png', price: 25 }
      ],
      network: [
        { id: 'router', name: 'Router', image: '../images/router.png', price: 200 },
        { id: 'switch', name: 'Netværksswitch', image: '../images/switch.png', price: 150 },
        { id: 'ethernet', name: 'Ethernetkabel', image: '../images/EthernetCable.png', price: 10 },
        { id: 'accessPoint', name: 'Access Point', image: '../images/accessPoint.png', price: 100 }
      ]
    };

    // Selected equipment
    const selectedEquipment = [];

    // Update the gallery based on the selected equipment type
    function updateGallery() {
      const equipmentType = document.getElementById('equipmentType').value;
      const gallery = document.getElementById('equipmentGallery');
      gallery.innerHTML = ''; // Clear the gallery

      equipmentData[equipmentType].forEach(item => {
        const galleryItem = document.createElement('div');
        galleryItem.className = 'gallery-item';
        galleryItem.onclick = () => toggleSelection(galleryItem, item);

        // Check if the item is already selected
        if (selectedEquipment.some(e => e.id === item.id)) {
          galleryItem.classList.add('selected');
        }

        galleryItem.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <p>${item.name} - ${item.price} DKK</p>
        `;

        gallery.appendChild(galleryItem);
      });
    }

    // Toggle selection of gallery items
    function toggleSelection(element, item) {
      element.classList.toggle('selected');
      if (element.classList.contains('selected')) {
        selectedEquipment.push(item);
      } else {
        const index = selectedEquipment.findIndex(e => e.id === item.id);
        if (index > -1) selectedEquipment.splice(index, 1);
      }
      calculateEstimate();
    }

    // Calculate estimate
    function calculateEstimate() {
      const totalCost = selectedEquipment.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('estimateText').innerText = `${totalCost} DKK`;
    }

    // Function to toggle the visibility of the venue creation form
    function toggleVenueForm() {
      const venueForm = document.getElementById('venueForm');
      venueForm.classList.toggle('hidden');
    }

    // Function to add a new venue to the list
    function addVenue() {
      const venueName = document.getElementById('venueName').value;
      const venueLocation = document.getElementById('venueLocation').value;
      const venueCapacity = document.getElementById('venueCapacity').value;

      if (venueName && venueLocation && venueCapacity) {
        const venueList = document.getElementById('venueList');
        const listItem = document.createElement('li');
        listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
        listItem.onclick = () => viewVenueDetails(venueName, venueLocation, venueCapacity);

        // Venue details
        const venueDetails = document.createElement('span');
        venueDetails.textContent = `${venueName} - ${venueLocation} (Kapacitet: ${venueCapacity})`;
        listItem.appendChild(venueDetails);

        venueList.appendChild(listItem);

        // Clear the form fields and reset selections
        document.getElementById('venueForm').reset();
        selectedEquipment.length = 0;
        calculateEstimate();
        toggleVenueForm();
      } else {
        alert('Udfyld venligst alle felter for at oprette en venue.');
      }
    }

    // View venue details
    function viewVenueDetails(name, location, capacity) {
      alert(`Venue: ${name}\nPlacering: ${location}\nKapacitet: ${capacity}\nUdstyr:\n${selectedEquipment.map(e => `${e.name} (${e.price} DKK)`).join('\n')}`);
    }

    // Update slider value display
    function updateSliderValue(sliderId, displayId) {
      const slider = document.getElementById(sliderId);
      const sliderValue = document.getElementById(displayId);
      sliderValue.textContent = slider.value;
    }

    // Initialize the gallery with PC equipment by default
    document.addEventListener('DOMContentLoaded', updateGallery);
  </script>
</body>

</html>
